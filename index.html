<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142528" />
    <link rel="icon" href="/assets/ruin-stone.png" type="image/png" />
    <title>雾海行纪 · 雾灯谷</title>
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <div class="brand">
          <span class="brand-mark"
            ><img src="/assets/ruin-stone.png" alt=""
          /></span>
          <div>
            <h1>雾海行纪</h1>
            <p>雾灯谷</p>
          </div>
        </div>
        <div class="toolbar">
          <span id="connection" class="connection" role="status">正在连接</span>
          <button id="music" type="button" aria-pressed="false" disabled>
            音乐关
          </button>
          <button id="pause" type="button" aria-pressed="false" disabled>
            暂停
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="stage" aria-label="雾灯谷场景">
          <div class="scene-bar">
            <div class="location">
              <span></span>
              <h2 id="location">谷地聚落</h2>
            </div>
            <button id="overview" type="button" aria-pressed="false" disabled>
              全谷地图
            </button>
          </div>
          <div class="viewport">
            <div
              id="game"
              tabindex="0"
              aria-label="游戏场景，方向键或 WASD 移动，E 交互"
              data-ready="false"
            ></div>
            <div id="screen-message" class="screen-message" role="status">
              <strong id="screen-title">正在进入雾灯谷</strong>
              <span id="screen-detail">正在读取本地素材和存档。</span>
              <button id="retry" type="button" hidden>重试连接</button>
            </div>
          </div>
          <div class="interaction">
            <div class="interaction-copy">
              <img
                id="feedback-icon"
                class="pixel feedback-icon"
                alt=""
                hidden
              />
              <div>
                <strong id="target">四处走走</strong>
                <p id="feedback" aria-live="polite">
                  沿小路向东，在河边查看旧桥。
                </p>
              </div>
            </div>
            <div id="actions" class="actions">
              <button id="interact" class="primary" type="button" disabled>
                交互 <kbd>E</kbd>
              </button>
              <button id="bridge-check" type="button" hidden>查看旧桥</button>
            </div>
          </div>
          <div class="controls">
            <span
              ><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd
              ><span class="control-alt"> 或方向键</span> 移动</span
            >
            <span><kbd>E</kbd> 交互</span><span><kbd>Esc</kbd> 暂停</span>
            <button id="sound" type="button" aria-pressed="true">音效开</button>
          </div>
          <div class="touch-controls" aria-label="触屏移动">
            <button type="button" data-move="up" aria-label="向上">↑</button>
            <button type="button" data-move="left" aria-label="向左">←</button>
            <button type="button" data-move="down" aria-label="向下">↓</button>
            <button type="button" data-move="right" aria-label="向右">→</button>
          </div>
        </section>

        <aside class="journal" aria-label="旅人手记">
          <section class="panel goal">
            <div class="panel-heading">
              <span class="panel-icon"
                ><img class="pixel" src="/assets/toolbox.png" alt=""
              /></span>
              <div>
                <p>当前目标</p>
                <h2 id="objective">修复雾灯旧桥</h2>
              </div>
            </div>
            <p id="next-step" class="next-step">向东走到河边，查看雾灯旧桥。</p>
            <div class="measure">
              <span>已交木材</span><strong id="bridge-wood">0 / 6</strong>
            </div>
            <div class="measure">
              <span>已交石材</span><strong id="bridge-stone">0 / 2</strong>
            </div>
            <div class="measure work-label">
              <label for="progress">施工进度</label
              ><strong id="percent">0%</strong>
            </div>
            <progress id="progress" value="0" max="100">0%</progress>
          </section>

          <section class="panel inventory">
            <h2>背包</h2>
            <ul id="inventory" aria-label="物品栏"></ul>
          </section>

          <section class="panel residents">
            <h2>谷中居民</h2>
            <ul id="residents"></ul>
          </section>

          <footer class="save-bar">
            <span id="save-status">等待读取存档</span>
            <button id="reset" type="button" disabled>重开旅程</button>
          </footer>
        </aside>
      </main>
    </div>

    <dialog id="reset-dialog" aria-labelledby="reset-title">
      <h2 id="reset-title">重开旅程？</h2>
      <p>确认后会替换当前单人存档，旅人将回到雾灯谷入口。</p>
      <form method="dialog">
        <button value="cancel" autofocus>继续当前旅程</button>
        <button value="reset" class="primary">确认重开</button>
      </form>
    </dialog>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
